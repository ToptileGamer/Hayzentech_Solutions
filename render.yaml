# HayzenTech Solutions - Render Blueprint
# Deploys the backend web service + PostgreSQL database together.
# See https://render.com/docs/blueprint-spec for details.

services:
  - type: web
    name: hayzentech-backend
    runtime: node
    rootDir: backend
    repo: https://github.com/ToptileGamer/Hayzentech_Solutions
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    postDeployCommand: npm run render:init
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: hayzentech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        # After deployment, replace this with your actual Render app URL
        value: https://your-app-name.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: hayzentech-db
    plan: free
    region: singapore
    databaseName: hayzentech
    user: hayzentech_user
    ipAllowList: [] # allow only from internal services
